<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Juicy Scroll Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      background: #ff6a00;
    }

    body {
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    .scroll-section {
      height: 900vh;
      position: relative;
      background: #ff6a00;
    }

    .sticky-wrap {
      position: sticky;
      top: 0;

      width: 100%;
      height: 100vh;

      overflow: hidden;
      background: #ff6a00;
    }

    /* =========================
       VIDEO
    ========================= */

    #juiceVideo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      z-index: 1;
      display: block;
    }


    /* =========================
       NAVBAR
    ========================= */

    .top-nav {
      position: absolute;

      top: 28px;
      left: 0;

      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;

      z-index: 20;

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }


    /* SEPARATE LOGO */

    .brand-logo {
      position: absolute;

      left: 38px;
      top: 50%;

      transform: translateY(-50%);

      color: #ffffff;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: 800;
      font-style: italic;

      white-space: nowrap;
    }


    /* GLASS NAVBAR */

    .nav-pill {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: fit-content;
      height: 76px;

      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 24px;

      border-radius: 999px;

      border: 2px solid rgba(255, 255, 255, 0.55);

      background:
        linear-gradient(
          90deg,
          rgba(255, 129, 53, 0.55),
          rgba(255, 94, 0, 0.35),
          rgba(255, 126, 40, 0.55)
        );

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow:
        0 14px 35px rgba(139, 53, 0, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }


    .nav-pill::before {
      content: "";

      position: absolute;
      inset: 0;

      border-radius: inherit;

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.16),
          transparent 45%
        );

      pointer-events: none;
    }


    /* NAV TEXT */

    .nav-item {
      position: relative;
      z-index: 2;

      color: #ffffff;

      text-decoration: none;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 23px;
      font-weight: 600;

      padding: 14px 18px;

      border-radius: 999px;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        color 0.25s ease;
    }


    .nav-item:hover {
      transform: translateY(-2px);

      background: rgba(255, 255, 255, 0.12);
    }


    /* HOME ACTIVE */

    .nav-item.active {
      color: #222222;

      background: #ffffff;

      padding: 17px 38px;

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.13);
    }


    /* DIVIDER */

    .nav-divider {
      position: relative;
      z-index: 2;

      width: 1px;
      height: 42px;

      margin-left: 8px;

      background: rgba(255, 255, 255, 0.78);
    }


    /* ORDER NOW */

    .order-nav {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      gap: 18px;

      padding: 17px 34px;

      border-radius: 999px;

      background: #ffffff;
      color: #222222;

      text-decoration: none;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 23px;
      font-weight: 700;

      white-space: nowrap;

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.14);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }


    .order-nav span {
      font-family: Arial, sans-serif;
      font-size: 30px;
      line-height: 1;
    }


    .order-nav:hover {
      transform: translateY(-3px);

      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.20);
    }


    /* RESPONSIVE */

    @media (max-width: 1100px) {

      .brand-logo {
        font-size: 26px;
      }

      .nav-pill {
        gap: 15px;
        height: 66px;
      }

      .nav-item,
      .order-nav {
        font-size: 17px;
      }

      .nav-item.active {
        padding: 14px 24px;
      }

      .order-nav {
        padding: 14px 22px;
      }
    }

  </style>

</head>

<body>

  <section class="scroll-section" id="scrollSection">

    <div class="sticky-wrap">

      <!-- NAVBAR -->
      <nav class="top-nav" id="mainNavbar">

        <div class="brand-logo">
          Dr Pepper
        </div>

        <div class="nav-pill">

          <a href="#" class="nav-item active">Home</a>
          <a href="#" class="nav-item">Flavors</a>
          <a href="#" class="nav-item">Products</a>
          <a href="#" class="nav-item">About</a>
          <a href="#" class="nav-item">Contact</a>

          <div class="nav-divider"></div>

          <a href="#" class="order-nav">
            Order Now
            <span>→</span>
          </a>

        </div>

      </nav>


      <!-- VIDEO -->
      <video
        id="juiceVideo"
        muted
        playsinline
        preload="auto"
      >
        <source
          src="animation_juice_scroll_smooth.mp4"
          type="video/mp4"
        />
      </video>

    </div>

  </section>


  <!-- FLAVOR DETAILS SEPARATE FILE -->
  <script src="components/flavor-text.js"></script>


  <script>

    const video =
      document.getElementById("juiceVideo");

    const section =
      document.getElementById("scrollSection");

    const mainNavbar =
      document.getElementById("mainNavbar");


    let duration = 0;
    let targetTime = 0;
    let displayTime = 0;


    video.addEventListener(
      "loadedmetadata",
      () => {

        duration = video.duration;

        video.pause();

        video.currentTime = 0;

        calculateTarget();

      }
    );


    function calculateTarget() {

      if (!duration) return;


      const rect =
        section.getBoundingClientRect();


      const maxScroll =
        section.offsetHeight -
        window.innerHeight;


      const scrolled =
        Math.min(
          Math.max(-rect.top, 0),
          maxScroll
        );


      const progress =
        scrolled / maxScroll;


      /* =========================
         VIDEO PROGRESS
      ========================= */

      targetTime =
        progress * duration;


      /* =========================
         FLAVOR DETAILS
      ========================= */

      window.updateFlavorDetails?.(progress);


      /* =========================
         NAVBAR VISIBILITY
         Group scene only
      ========================= */

      const navFadeStart = 0.18;
      const navFadeEnd = 0.24;

      let navOpacity = 1;


      if (progress >= navFadeStart) {

        navOpacity =
          1 -
          Math.min(
            (progress - navFadeStart) /
            (navFadeEnd - navFadeStart),
            1
          );

      }


      mainNavbar.style.opacity =
        navOpacity;


      mainNavbar.style.transform =
        `translateY(${(1 - navOpacity) * -20}px)`;


      mainNavbar.style.pointerEvents =
        navOpacity <= 0.05
          ? "none"
          : "auto";

    }


    function animate() {

      if (duration) {

        displayTime +=
          (targetTime - displayTime) * 0.12;


        if (
          Math.abs(
            video.currentTime -
            displayTime
          ) > 0.025
        ) {

          video.currentTime =
            displayTime;

        }

      }


      requestAnimationFrame(
        animate
      );

    }


    window.addEventListener(
      "scroll",
      calculateTarget,
      {
        passive: true
      }
    );


    window.addEventListener(
      "resize",
      calculateTarget
    );


    calculateTarget();
    animate();

  </script>

</body>

</html>
